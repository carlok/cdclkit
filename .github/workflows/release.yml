name: release

# Tokenless publishing via PyPI Trusted Publishing: GitHub mints a short-lived
# OIDC identity token for this workflow and PyPI verifies it, so there is no
# long-lived secret in this repository.
#
# Two distributions go out together: the pure-Python `cdclkit`, and the optional
# `cdclkit-native` accelerator as per-platform wheels. They share a version,
# which tests/test_packaging.py enforces.
#
# The native wheels are abi3 (pyo3 `abi3-py310`), so one wheel per platform
# covers every Python from 3.10 up rather than one per (platform, version).
# That turns a 20-wheel matrix into four.
#
# No Windows: it has never been tested, and the classifiers say so rather than
# implying support.

# Tags only. A `workflow_dispatch` trigger used to sit here for the very first
# publish. It ran this file *from whichever branch was selected*, so a branch
# could publish under any version it declared, or simply delete the check
# below. The deploy environments are also restricted to `v*` tags in the
# repository settings: that is the one control a branch cannot edit.
#
# To retry a failed publish, use "Re-run failed jobs" on the tag's run, which
# keeps the tag ref. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      # ci.yml triggers on branches and pull requests, not on tags, so
      # without this nothing tests the ref being published.
      - run: pip install dratify && python -m unittest discover -s tests
      - run: python -m build
      - run: twine check dist/*
      - name: only a tag may publish, and it must name the version being built
        run: |
          # Unconditional. This used to apply only `if` the ref was a tag, so
          # any other way of starting the workflow skipped it entirely.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::releases come from v* tags only, not from" \
                 "$GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          BUILT=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "tag=$TAG built=$BUILT"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::tagged $TAG but built $BUILT -- the version was not "\
                 "bumped. skip-existing would then publish nothing and report "\
                 "success."
            exit 1
          fi
      # Extracted here rather than in github-release, so a tag whose version has
      # no CHANGELOG section stops before anything is published.
      - name: the tag's CHANGELOG section, which becomes the release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p notes
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "::error::CHANGELOG.md has no '## [$v]' section for the release notes"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Nothing is published until everything is built. pypi used to need only
  # `build`, so cdclkit 0.2.0 went out while its wheels were still building;
  # when they failed, `cdclkit[native]==0.2.0` named a package that did not
  # exist. Both publish jobs now wait for every build, and `build` (the tests
  # and the tag check) gates the native half too.
  pypi:
    needs: [build, wheels, native-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # Re-running a release must not fail on the half that already
          # succeeded. This job did exactly that: the wheels needed a rebuild
          # after dropping macos-13, and the rerun died with 400 Bad Request
          # because cdclkit itself was already published.
          skip-existing: true

  # -- the optional Rust accelerator -------------------------------------
  wheels:
    name: wheels (${{ matrix.target }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          # macos-latest rather than a numbered image: macos-14 was retired under a
          # release, whose wheels were then cancelled before any step ran. abi3 means
          # the image does not decide which Pythons a wheel serves.
          - { os: macos-latest,  target: aarch64 }
          # Intel macOS is cross-compiled from the arm64 runner rather than
          # built on macos-13. That image is being retired and its runners are
          # scarce: the job sat queued for over ten minutes with none assigned,
          # holding up a release whose other four builds had finished. abi3 +
          # cross-compilation needs no Intel host.
          - { os: macos-latest,  target: x86_64 }
    needs: build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path native/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  native-sdist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist --manifest-path native/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/

  pypi-native:
    needs: [build, wheels, native-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  # -- the GitHub Release entry ------------------------------------------
  # Last, so an entry never announces a release that did not finish. This is
  # the only job that can write to the repository: contents: write is granted
  # here and nowhere else, and the workflow default stays read-only.
  github-release:
    needs: [pypi, pypi-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes/
      - name: create the release with the tag's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Re-run all jobs" must not fail on an entry the first run made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::the release $GITHUB_REF_NAME already exists; left as it is"
            exit 0
          fi
          # bench/baseline.json is the conflict-count reference the benchmark
          # harness checks against; attached, it makes the performance claims
          # re-runnable by whoever downloads the release.
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "cdclkit ${GITHUB_REF_NAME#v}" \
            --notes-file notes/notes.md bench/baseline.json
