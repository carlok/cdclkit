name: release

# Tokenless publishing via PyPI Trusted Publishing: GitHub mints a short-lived
# OIDC identity token for this workflow and PyPI verifies it, so there is no
# long-lived secret in this repository.
#
# Two distributions go out together: the pure-Python `cdclkit`, and the optional
# `cdclkit-native` accelerator as per-platform wheels. They share a version,
# which tests/test_packaging.py enforces.
#
# The native wheels are abi3 (pyo3 `abi3-py310`), so one wheel per platform
# covers every Python from 3.10 up rather than one per (platform, version).
# That turns a 20-wheel matrix into four.
#
# No Windows: it has never been tested, and the classifiers say so rather than
# implying support.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Re-running a release must not fail on the half that already
          # succeeded. This job did exactly that: the wheels needed a rebuild
          # after dropping macos-13, and the rerun died with 400 Bad Request
          # because cdclkit itself was already published.
          skip-existing: true

  # -- the optional Rust accelerator -------------------------------------
  wheels:
    name: wheels (${{ matrix.target }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-14,      target: aarch64 }
          # Intel macOS is cross-compiled from the arm64 runner rather than
          # built on macos-13. That image is being retired and its runners are
          # scarce: the job sat queued for over ten minutes with none assigned,
          # holding up a release whose other four builds had finished. abi3 +
          # cross-compilation needs no Intel host.
          - { os: macos-14,      target: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path native/Cargo.toml
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  native-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist --manifest-path native/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: dist/

  pypi-native:
    needs: [wheels, native-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
