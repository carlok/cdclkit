name: release

# Tokenless publishing via PyPI Trusted Publishing: GitHub mints a short-lived
# OIDC identity token for this workflow and PyPI verifies it, so there is no
# long-lived secret in this repository.
#
# Only the pure-Python wheel is published here. The Rust engine is an optional
# accelerator and needs a per-platform build matrix, which is deliberately a
# separate concern -- the dependency-free path is the one that must never break.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
