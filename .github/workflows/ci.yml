name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # the only dependency is dratify, which itself has none
      - run: pip install dratify
      - run: python -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install dratify
      - run: python tests/coverage_report.py

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install dratify
      - run: for f in examples/*.py; do echo "== $f"; python "$f" || exit 1; done

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - run: pip install dratify maturin
      # `maturin develop` needs an active virtualenv, which setup-python does
      # not give you. Build the wheel and install it instead -- which is also
      # closer to what a user does.
      - run: cd native && maturin build --release --out dist
      - run: pip install native/dist/*.whl
      - run: python -c "import cdclkit_native; print('native engine loaded')"
      # the same suite against the Rust engine: it is bit-exact with Python,
      # and this is what would catch a divergence
      - run: python -m unittest discover -s tests
      # --no-default-features turns off pyo3's extension-module so the tests
      # can link; this is what makes the crate's own unit tests runnable
      # outside CI as well.
      - run: cd native && cargo test --release --no-default-features
      - run: cd native && cargo clippy --all-targets -- -D warnings
