name: fuzz

# The suite is deterministic by default so CI is reproducible. This runs it at
# offsets nobody has tried, which is the only way a fixed corpus finds anything
# new. The first shifted run after wiring this up turned up a test that was
# fragile to its own seed.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seed:
        description: "CDCLKIT_FUZZ_SEED offset"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  shifted-seeds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        offset: [1, 1000, 77777, 424242, 8675309]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install dratify
      - name: run the suite at a shifted seed
        env:
          CDCLKIT_FUZZ_SEED: ${{ github.event.inputs.seed || matrix.offset }}
          CDCLKIT_FUZZ: "2"
        run: python -m unittest discover -s tests
