name: audit

# Advisories are published against crates that have not changed, so a check
# that runs only when the lockfile moves would miss the case that matters. This
# runs weekly as well, and in its own workflow so that a new advisory fails
# here instead of turning every unrelated PR red.

on:
  push:
    branches: [main]
    paths:
      - native/Cargo.lock
      - native/Cargo.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - native/Cargo.lock
      - native/Cargo.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # --locked builds the tool from its own lockfile. Pinned by hand:
      # Dependabot cannot see a version on a command line.
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cd native && cargo audit
