# Pinning actions to commit SHAs makes them immutable, which is the point --
# and also means they never update on their own. Dependabot is the other half:
# without it, a pin is just a stale dependency with extra steps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: monthly
